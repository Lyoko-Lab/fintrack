name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes a GitHub release, once the
# same checks as CI pass and the tag matches the versions in pyproject.toml and web/package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The notes are the tag's section of CHANGELOG.md, with CHANGELOG.zh-CN.md's after it.
      - run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Fintrack ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
