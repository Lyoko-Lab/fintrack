[project]
name = "fintrack"
version = "0.1.0"
description = "Personal finance tracker: bank sync, unified ledger, insights."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16",
    "keyring>=25",
    "python-dotenv>=1.0",
    "uvicorn>=0.32",
]

[project.scripts]
fintrack = "fintrack.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fintrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
